<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A7C4A">
<title>Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#12202B; --muted:#5B6B78; --line:#DDE3E8;
  --accent:#0A7C4A; --accent-ink:#FFFFFF; --user:#12202B; --user-ink:#FFFFFF;
  --danger:#B3261E; --code:#EEF2F5; --scrim:rgba(10,20,28,.45);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1820; --surface:#15232D; --ink:#E8EEF2; --muted:#93A3AF; --line:#243541;
    --accent:#3DD598; --accent-ink:#06261A; --user:#DDE8EF; --user-ink:#0E1820;
    --danger:#FF8A80; --code:#1B2C38; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1820; --surface:#15232D; --ink:#E8EEF2; --muted:#93A3AF; --line:#243541;
  --accent:#3DD598; --accent-ink:#06261A; --user:#DDE8EF; --user-ink:#0E1820;
  --danger:#FF8A80; --code:#1B2C38; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.logo{display:inline-flex;align-items:center;gap:8px;font:700 22px/1 var(--display);letter-spacing:-.02em}
.logo svg{width:22px;height:22px;fill:var(--accent);stroke:none}

/* Auth */
#auth{min-height:100%;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.auth-card{width:100%;max-width:400px}
.auth-card h1{font:700 34px/1.1 var(--display);letter-spacing:-.03em;margin:20px 0 6px}
.auth-card p.sub{color:var(--muted);margin:0 0 24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;background:var(--surface)}
.tabs button{border:0;background:none;padding:10px;border-radius:9px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{width:auto;padding:8px 14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:16px 0}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;width:auto}
.msg-note{font-size:14px;margin:12px 0 0;min-height:20px}
.msg-note.err{color:var(--danger)}
.msg-note.ok{color:var(--accent)}

/* App shell */
#app{height:100dvh;display:grid;grid-template-columns:1fr}
aside{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease;z-index:30;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.open{transform:none}
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.side-top{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.new-chat{margin:8px 16px 12px;width:auto}
#convList{flex:1;overflow-y:auto;padding:0 8px}
.conv{display:flex;align-items:center;border-radius:10px;margin-bottom:2px}
.conv.active{background:var(--bg)}
.conv .t{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .more{background:none;border:0;padding:8px;color:var(--muted);border-radius:8px}
.conv-actions{display:flex;gap:8px;padding:0 10px 8px}
.conv-actions button{flex:1;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.conv-actions .del{color:var(--danger)}
.side-bottom{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.side-bottom .row{display:flex;gap:8px}
.empty-list{color:var(--muted);font-size:14px;padding:8px 12px}

main{display:flex;flex-direction:column;min-width:0;height:100dvh}
header.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
header.top .ttl{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{background:none;border:0;padding:8px;border-radius:10px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--bg)}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.low{border-color:var(--danger);color:var(--danger)}

#thread{flex:1;overflow-y:auto;padding:20px 16px 8px;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto}
.hero{padding:10vh 0 8px}
.hero h2{font:700 clamp(30px,7vw,44px)/1.08 var(--display);letter-spacing:-.03em;margin:0 0 10px}
.hero p{color:var(--muted);margin:0 0 20px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
.m{margin:0 0 18px;display:flex}
.m.user{justify-content:flex-end}
.m.user .b{background:var(--user);color:var(--user-ink);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.assistant .b{max-width:100%;overflow-wrap:anywhere;width:100%}
.m.assistant .tools{margin-top:4px}
.tools button{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
.tools button:hover{background:var(--bg)}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 12px}
.md ul,.md ol{padding-left:22px;margin:0 0 12px}
.md h1,.md h2,.md h3{font-family:var(--display);line-height:1.2;margin:18px 0 8px}
.md a{color:var(--accent)}
.md code{background:var(--code);padding:2px 6px;border-radius:6px;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.md pre{position:relative;background:var(--code);border-radius:12px;padding:14px;overflow-x:auto;margin:0 0 12px}
.md pre code{background:none;padding:0;white-space:pre}
.md pre .copy{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:0 0 12px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px}
.md blockquote{margin:0 0 12px;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}aside{transition:none}#thread{scroll-behavior:auto}}

.composer{padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.box{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.box:focus-within{border-color:var(--accent)}
.box textarea{width:100%;border:0;background:none;resize:none;outline:none;padding:6px 8px;max-height:180px;min-height:28px;display:block}
.box .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.files{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 6px}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;max-width:100%}
.file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.file-chip button{background:none;border:0;padding:2px;color:var(--muted)}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:9px 11px;display:inline-grid;place-items:center}
.send[disabled]{opacity:.45;cursor:not-allowed}
.hint{max-width:760px;margin:6px auto 0;text-align:center;font-size:12px;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(92vw,440px);max-height:88dvh}
dialog::backdrop{background:var(--scrim)}
.dlg{padding:20px}
.dlg h3{font:700 22px/1.2 var(--display);margin:0 0 4px;letter-spacing:-.02em}
.dlg p{color:var(--muted);margin:0 0 16px}
.dlg .x{float:right;margin:-8px -8px 0 0}
.pkgs{display:grid;gap:10px;margin-bottom:8px}
.pkg{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pkg b{display:block}
.pkg small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}

@media (min-width:900px){
  #app{grid-template-columns:290px 1fr}
  aside{position:static;transform:none;width:auto}
  #scrim{display:none!important}
  #menuBtn{display:none}
}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth" hidden>
  <div class="auth-card">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 1.5c.6 5.2 2.3 8.7 4.7 10.5 1.9 1.4 3.8 1.9 5.8 2-6 .7-8.4 3-9.6 8.5-.7-5.4-3-7.8-9-8.5C9.700 13 11.300 9 12 1.500z"/></svg>Nova</div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to continue your chats.</p>

    <div id="authMain">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabIn" aria-selected="true">Sign in</button>
        <button role="tab" id="tabUp" aria-selected="false">Create account</button>
      </div>
      <button class="btn" id="googleBtn" type="button">
        <svg viewBox="0 0 24 24" style="stroke:none"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.500-.2-2.200H12v4.200h5.900c-.3 1.400-1 2.500-2.200 3.300v2.700h3.500c2.100-1.900 3.300-4.700 3.300-8z"/><path fill="#34A853" d="M12 23c3 0 5.500-1 7.300-2.700l-3.500-2.700c-1 .7-2.300 1.100-3.800 1.100-2.900 0-5.400-2-6.300-4.600H2.100v2.800C3.900 20.500 7.700 23 12 23z"/><path fill="#FBBC05" d="M5.700 14.100c-.2-.7-.4-1.400-.4-2.100s.1-1.400.4-2.100V7.100H2.100C1.400 8.600 1 10.200 1 12s.4 3.400 1.100 4.900l3.600-2.800z"/><path fill="#EA4335" d="M12 5.300c1.600 0 3.100.6 4.200 1.600l3.100-3.100C17.500 2.100 15 1 12 1 7.700 1 3.900 3.500 2.100 7.100l3.600 2.800C6.600 7.300 9.100 5.300 12 5.300z"/></svg>
        Continue with Google
      </button>
      <div class="divider">or use email</div>
      <form id="authForm" novalidate>
        <label class="field" id="nameWrap" hidden><span>Your name</span><input id="name" type="text" autocomplete="name" maxlength="100"></label>
        <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" inputmode="email" required></label>
        <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="btn primary" id="authSubmit" type="submit">Sign in</button>
        <p style="text-align:center;margin:14px 0 0"><button class="link" id="forgotBtn" type="button">Forgot password?</button></p>
      </form>
    </div>

    <form id="resetForm" hidden novalidate>
      <label class="field"><span>New password</span><input id="newPass" type="password" autocomplete="new-password" minlength="6" required></label>
      <button class="btn primary" type="submit">Save new password</button>
    </form>
    <p class="msg-note" id="authNote" role="status"></p>
  </div>
</section>

<!-- APP -->
<div id="app" hidden>
  <div id="scrim" hidden></div>
  <aside id="side" aria-label="Chats">
    <div class="side-top">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 1.5c.6 5.2 2.3 8.7 4.7 10.5 1.9 1.4 3.8 1.9 5.8 2-6 .7-8.4 3-9.6 8.5-.7-5.4-3-7.8-9-8.5C9.700 13 11.300 9 12 1.500z"/></svg>Nova</div>
      <button class="icon-btn" id="closeSide" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="btn primary new-chat" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div id="convList"></div>
    <div class="side-bottom">
      <button class="btn" id="buyBtn">Buy credits</button>
      <div class="row">
        <button class="btn small" id="settingsBtn" style="flex:1">Settings</button>
        <button class="btn small" id="signOut" style="flex:1">Sign out</button>
      </div>
    </div>
  </aside>

  <main>
    <header class="top">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="ttl" id="chatTitle">New chat</div>
      <button class="pill" id="creditPill" aria-label="Credits">… credits</button>
    </header>
    <div id="thread"><div class="col" id="msgs"></div></div>
    <div class="composer">
      <div class="box">
        <div class="files" id="files" hidden></div>
        <textarea id="input" rows="1" placeholder="Message Nova" aria-label="Message"></textarea>
        <div class="bar">
          <button class="icon-btn" id="attachBtn" aria-label="Attach a file"><svg viewBox="0 0 24 24"><path d="M21 11.500l-8.600 8.600a5.500 5.500 0 0 1-7.800-7.800l8.600-8.600a3.700 3.700 0 0 1 5.200 5.200l-8.600 8.600a1.800 1.800 0 0 1-2.600-2.600l7.900-7.900"/></svg></button>
          <input type="file" id="fileInput" hidden accept="image/png,image/jpeg,image/webp,image/gif,text/plain,text/markdown,text/csv">
          <button class="send" id="sendBtn" aria-label="Send" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
      <div class="hint">Nova can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<!-- Credits dialog -->
<dialog id="creditsDlg"><div class="dlg">
  <button class="icon-btn x" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h3>Buy credits</h3>
  <p>Each message uses about 1 credit. Your balance: <b id="dlgBalance">0</b></p>
  <div class="pkgs" id="pkgs"></div>
  <p class="msg-note" id="buyNote" role="status" style="margin-top:8px"></p>
</div></dialog>

<!-- Settings dialog -->
<dialog id="settingsDlg"><div class="dlg">
  <button class="icon-btn x" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h3>Settings</h3>
  <p id="setEmail"></p>
  <label class="field"><span>Display name</span><input id="setName" type="text" maxlength="100"></label>
  <label class="field"><span>Theme</span>
    <select id="setTheme" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)">
      <option value="auto">Match my device</option><option value="light">Light</option><option value="dark">Dark</option>
    </select>
  </label>
  <button class="btn primary" id="saveSettings">Save changes</button>
  <p class="msg-note" id="setNote" role="status"></p>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <label class="field"><span>Change password</span><input id="setPass" type="password" autocomplete="new-password" minlength="6" placeholder="New password (6+ characters)"></label>
  <button class="btn" id="savePass">Update password</button>
  <p class="msg-note" id="passNote" role="status"></p>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <button class="btn" id="delAcct" style="color:var(--danger);border-color:var(--danger)">Delete my account</button>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
(function(){
"use strict";

/* ---- Config (these two values are public by design; security comes from RLS) ---- */
const SUPABASE_URL = "https://mpztiedpczprfrkglvkr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wenRpZWRwY3pwcmZya2dsdmtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODk4MTIsImV4cCI6MjEwNjg2NTgxMn0.mSoRMkulvTJn15QX932EESFQozeZJSbZLZa--Joa_js";

/* Set to true after you enable the Google provider in Supabase */
const ENABLE_GOOGLE = false;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const $ = (s) => document.querySelector(s);
const state = { user: null, profile: null, convs: [], activeId: null, balance: null, sending: false, files: [], mode: "in", appShown: false };

/* ---- Helpers ---- */
function toast(text){
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role","status"); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function applyTheme(v){
  const r = document.documentElement;
  if (v === "light" || v === "dark") r.setAttribute("data-theme", v); else r.removeAttribute("data-theme");
}
applyTheme(store("nova-theme"));

async function fnError(error){
  try { const r = error && error.context; if (r && typeof r.json === "function") return await r.json(); } catch(e){}
  return { error: (error && error.message) || "Something went wrong. Try again." };
}
const fmtMoney = (minor, cur) => {
  try { return new Intl.NumberFormat("en-NG", { style:"currency", currency: cur, maximumFractionDigits: 0 }).format(minor/100); }
  catch(e){ return (minor/100) + " " + cur; }
};

/* ---- Screens ---- */
function showAuth(){
  state.appShown = false;
  $("#app").hidden = true; $("#auth").hidden = false;
}
function showApp(){
  $("#auth").hidden = true; $("#app").hidden = false;
  if (!state.appShown){ state.appShown = true; bootApp(); }
}

/* ---- Auth ---- */
function setMode(mode){
  state.mode = mode;
  const up = mode === "up";
  $("#tabIn").setAttribute("aria-selected", String(!up));
  $("#tabUp").setAttribute("aria-selected", String(up));
  $("#nameWrap").hidden = !up;
  $("#authSubmit").textContent = up ? "Create account" : "Sign in";
  $("#password").autocomplete = up ? "new-password" : "current-password";
  $("#authTitle").textContent = up ? "Create your account" : "Welcome back";
  $("#authSub").textContent = up ? "Start chatting with Nova in a minute." : "Sign in to continue your chats.";
  note("");
}
function note(text, kind){ const n = $("#authNote"); n.textContent = text; n.className = "msg-note" + (kind ? " " + kind : ""); }
$("#tabIn").onclick = () => setMode("in");
$("#tabUp").onclick = () => setMode("up");

$("#authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("#email").value.trim(), password = $("#password").value;
  if (!email || password.length < 6){ note("Enter your email and a password of at least 6 characters.", "err"); return; }
  const btn = $("#authSubmit"); btn.disabled = true; note("");
  try {
    if (state.mode === "up"){
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: $("#name").value.trim() || undefined }, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) note("Check your email to confirm your account, then sign in.", "ok");
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err){ note(err.message || "Could not continue. Try again.", "err"); }
  btn.disabled = false;
});
$("#googleBtn").onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
  if (error) note("Google sign-in is not set up yet. Use email for now.", "err");
};
$("#forgotBtn").onclick = async () => {
  const email = $("#email").value.trim();
  if (!email){ note("Enter your email above, then tap Forgot password again.", "err"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) note(error.message, "err"); else note("Password reset link sent. Check your email.", "ok");
};
$("#resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = $("#newPass").value;
  if (p.length < 6){ note("Use at least 6 characters.", "err"); return; }
  const { error } = await sb.auth.updateUser({ password: p });
  if (error){ note(error.message, "err"); return; }
  $("#resetForm").hidden = true; $("#authMain").hidden = false;
  toast("Password updated"); history.replaceState(null, "", location.pathname);
  showApp();
});

sb.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {
    if (event === "PASSWORD_RECOVERY"){
      showAuth(); $("#authMain").hidden = true; $("#resetForm").hidden = false;
      $("#authTitle").textContent = "Set a new password"; $("#authSub").textContent = "Choose a password you will remember."; return;
    }
    if (session && session.user){ state.user = session.user; if ($("#resetForm").hidden) showApp(); }
    else if (event === "SIGNED_OUT"){ state.user = null; showAuth(); }
  }, 0);
});

/* ---- Data ---- */
async function loadBalance(){
  const { data } = await sb.from("credits").select("balance").maybeSingle();
  setBalance(data ? Number(data.balance) : 0);
}
function setBalance(n){
  state.balance = n;
  const pill = $("#creditPill");
  pill.textContent = n + (n === 1 ? " credit" : " credits");
  pill.classList.toggle("low", n <= 0);
  $("#dlgBalance").textContent = n;
}
async function loadProfile(){
  const { data } = await sb.from("profiles").select("display_name").maybeSingle();
  state.profile = data || {};
}
async function loadConvs(){
  const { data, error } = await sb.from("conversations").select("id,title,last_message_at").order("last_message_at", { ascending: false }).limit(200);
  if (error){ toast("Could not load your chats."); return; }
  state.convs = data || []; renderConvs();
}
function renderConvs(){
  const box = $("#convList"); box.textContent = "";
  if (!state.convs.length){ const p = document.createElement("div"); p.className = "empty-list"; p.textContent = "Your chats will appear here."; box.appendChild(p); return; }
  state.convs.forEach((c) => {
    const wrap = document.createElement("div");
    const row = document.createElement("div"); row.className = "conv" + (c.id === state.activeId ? " active" : "");
    const t = document.createElement("button"); t.className = "t"; t.textContent = c.title; t.onclick = () => openConv(c.id);
    const more = document.createElement("button"); more.className = "more"; more.setAttribute("aria-label", "Chat options");
    more.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>';
    const actions = document.createElement("div"); actions.className = "conv-actions"; actions.hidden = true;
    const ren = document.createElement("button"); ren.textContent = "Rename";
    const del = document.createElement("button"); del.className = "del"; del.textContent = "Delete";
    more.onclick = () => { actions.hidden = !actions.hidden; };
    ren.onclick = async () => {
      const v = prompt("Rename chat", c.title); if (v === null) return;
      const title = v.trim().slice(0, 200); if (!title) return;
      const { error } = await sb.from("conversations").update({ title }).eq("id", c.id);
      if (error) toast("Could not rename the chat."); else { c.title = title; renderConvs(); if (c.id === state.activeId) $("#chatTitle").textContent = title; }
    };
    del.onclick = async () => {
      if (!confirm("Delete this chat? This cannot be undone.")) return;
      const { error } = await sb.from("conversations").delete().eq("id", c.id);
      if (error){ toast("Could not delete the chat."); return; }
      state.convs = state.convs.filter((x) => x.id !== c.id);
      if (state.activeId === c.id) newChat(); else renderConvs();
    };
    row.append(t, more); actions.append(ren, del); wrap.append(row, actions); box.appendChild(wrap);
  });
}

/* ---- Rendering messages ---- */
function renderMd(text){
  const wrap = document.createElement("div"); wrap.className = "md";
  wrap.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
  wrap.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  wrap.querySelectorAll("pre").forEach((pre) => {
    const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copy";
    b.onclick = async () => { try { await navigator.clipboard.writeText(pre.innerText.replace(/Copy$/, "").trim()); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500); } catch(e){ toast("Could not copy."); } };
    pre.appendChild(b);
  });
  return wrap;
}
function addMsg(role, text){
  const m = document.createElement("div"); m.className = "m " + role;
  const b = document.createElement("div"); b.className = "b";
  if (role === "user") b.textContent = text;
  else {
    b.appendChild(renderMd(text));
    const tools = document.createElement("div"); tools.className = "tools";
    const cp = document.createElement("button"); cp.type = "button"; cp.textContent = "Copy reply";
    cp.onclick = async () => { try { await navigator.clipboard.writeText(text); cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy reply", 1500); } catch(e){ toast("Could not copy."); } };
    tools.appendChild(cp); b.appendChild(tools);
  }
  m.appendChild(b); $("#msgs").appendChild(m); scrollDown(); return m;
}
function addTyping(){
  const m = document.createElement("div"); m.className = "m assistant";
  m.innerHTML = '<div class="b"><span class="dots" role="status" aria-label="Nova is typing"><i></i><i></i><i></i></span></div>';
  $("#msgs").appendChild(m); scrollDown(); return m;
}
function scrollDown(){ const t = $("#thread"); t.scrollTop = t.scrollHeight; }
function greeting(){
  const h = new Date().getHours();
  const g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  const n = state.profile && state.profile.display_name ? ", " + state.profile.display_name.split(" ")[0] : "";
  return g + n;
}


function showHero(){
  const box = $("#msgs");
  box.textContent = "";

  const hero = document.createElement("div");
  hero.className = "hero";

  const h = document.createElement("h2");
  h.textContent = "What can I help with?";

  const p = document.createElement("p");
  p.textContent = "Ask Nova anything, or choose a starting point below.";

  const chips = document.createElement("div");
  chips.className = "chips";
  chips.style.display = "grid";
  chips.style.gridTemplateColumns = "repeat(2, minmax(0, 1fr))";
  chips.style.gap = "12px";

  const cards = [
    {
      title: "Explain a topic",
      description: "Make difficult things easier to understand",
      prompt: "Explain something simply"
    },
    {
      title: "Help me write",
      description: "Draft a message, email, or story",
      prompt: "Help me write a message"
    },
    {
      title: "Brainstorm ideas",
      description: "Explore creative ideas and possibilities",
      prompt: "Give me ideas for"
    },
    {
      title: "Plan something",
      description: "Turn your goal into clear next steps",
      prompt: "Help me plan"
    }
  ];

  cards.forEach((item) => {
    const c = document.createElement("button");
    c.className = "prompt-card";
    c.style.background = "var(--surface)";
    c.style.color = "var(--ink)";
    c.style.border = "1px solid var(--line)";
    c.style.borderRadius = "14px";
    c.style.padding = "16px";
    c.style.minHeight = "105px";
    c.style.textAlign = "left";
    c.style.display = "flex";
    c.style.flexDirection = "column";
    c.style.alignItems = "flex-start";
    c.style.gap = "8px";
    c.style.cursor = "pointer";

    const title = document.createElement("strong");
    title.textContent = item.title;

    const desc = document.createElement("span");
    desc.textContent = item.description;
    desc.style.color = "var(--muted)";
    desc.style.fontSize = "13px";

    c.append(title, desc);

    c.onclick = () => {
      $("#input").value = item.prompt + ": ";
      autosize();
      $("#input").focus();
      updateSend();
    };

    chips.appendChild(c);
  });

  hero.append(h, p, chips);
  box.appendChild(hero);
}

/* ---- Conversations ---- */
function closeSide(){ $("#side").classList.remove("open"); $("#scrim").hidden = true; }
function newChat(){
  state.activeId = null; $("#chatTitle").textContent = "New chat"; showHero(); renderConvs(); closeSide(); $("#input").focus();
}
async function openConv(id){
  closeSide(); state.activeId = id;
  const c = state.convs.find((x) => x.id === id); $("#chatTitle").textContent = c ? c.title : "Chat"; renderConvs();
  const box = $("#msgs"); box.textContent = "";
  const { data, error } = await sb.from("messages").select("role,content").eq("conversation_id", id).order("created_at", { ascending: true });
  if (error){ toast("Could not load this chat."); return; }
  (data || []).forEach((m) => { if (m.role !== "system") addMsg(m.role, m.content); });
  scrollDown();
}

/* ---- Attachments ---- */
const ALLOWED = ["image/png","image/jpeg","image/webp","image/gif","text/plain","text/markdown","text/csv"];
$("#attachBtn").onclick = () => $("#fileInput").click();
$("#fileInput").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (state.files.length >= 5){ toast("You can attach up to 5 files."); return; }
  if (!ALLOWED.includes(f.type)){ toast("That file type is not supported."); return; }
  if (f.size > 20 * 1024 * 1024){ toast("Files must be under 20 MB."); return; }
  const path = state.user.id + "/" + crypto.randomUUID() + "-" + f.name.replace(/[^\w.\-]/g, "_");
  toast("Uploading " + f.name + "…");
  const up = await sb.storage.from("user-files").upload(path, f, { contentType: f.type });
  if (up.error){ toast("Upload failed. Try again."); return; }
  const ins = await sb.from("files").insert({ storage_path: path, original_name: f.name.slice(0, 255), mime_type: f.type, size_bytes: f.size }).select("id").single();
  if (ins.error){ await sb.storage.from("user-files").remove([path]); toast("Upload failed. Try again."); return; }
  state.files.push({ id: ins.data.id, name: f.name, path }); renderFiles(); updateSend();
});
function renderFiles(){
  const box = $("#files"); box.textContent = ""; box.hidden = !state.files.length;
  state.files.forEach((f, i) => {
    const c = document.createElement("div"); c.className = "file-chip";
    const s = document.createElement("span"); s.textContent = f.name;
    const x = document.createElement("button"); x.setAttribute("aria-label", "Remove " + f.name); x.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    x.onclick = async () => { state.files.splice(i, 1); renderFiles(); updateSend(); await sb.from("files").delete().eq("id", f.id); await sb.storage.from("user-files").remove([f.path]); };
    c.append(s, x); box.appendChild(c);
  });
}

/* ---- Sending ---- */
const input = $("#input");
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
function updateSend(){ $("#sendBtn").disabled = state.sending || !input.value.trim(); }
input.addEventListener("input", () => { autosize(); updateSend(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches){ e.preventDefault(); send(); }
});
$("#sendBtn").onclick = send;

async function send(){
  const text = input.value.trim();
  if (!text || state.sending) return;
  if (state.balance !== null && state.balance <= 0){ openCredits("You are out of credits. Buy more to keep chatting."); return; }
  state.sending = true; updateSend();
  const files = state.files.slice();
  if (!state.activeId && $("#msgs .hero")) $("#msgs").textContent = "";
  const shown = files.length ? text + "\n\n[Attached: " + files.map((f) => f.name).join(", ") + "]" : text;
  const userEl = addMsg("user", shown); const typing = addTyping();
  input.value = ""; autosize(); state.files = []; renderFiles();
  const body = { message: text, requestId: crypto.randomUUID(), attachments: files.map((f) => ({ fileId: f.id })) };
  if (state.activeId) body.conversationId = state.activeId;
  const { data, error } = await sb.functions.invoke("chat", { body });
  typing.remove();
  if (error || !data || !data.message){
    const info = error ? await fnError(error) : { error: (data && data.error) || "No reply received." };
    userEl.remove(); input.value = text; autosize();
    if (!$("#msgs").children.length) showHero();
    if (info.code === "INSUFFICIENT_CREDITS") openCredits("You are out of credits. Buy more to keep chatting.");
    else toast(info.error || "Something went wrong. Try again.");
    state.sending = false; updateSend(); return;
  }
  addMsg("assistant", data.message.content);
  if (typeof data.balance === "number" || /^\d+$/.test(String(data.balance))) setBalance(Number(data.balance));
  if (!state.activeId){ state.activeId = data.conversationId; }
  await loadConvs();
  const c = state.convs.find((x) => x.id === state.activeId); if (c) $("#chatTitle").textContent = c.title;
  state.sending = false; updateSend(); input.focus();
}

/* ---- Credits dialog ---- */
async function openCredits(message){
  closeSide(); $("#buyNote").textContent = message || ""; $("#buyNote").className = "msg-note" + (message ? " err" : "");
  $("#creditsDlg").showModal(); loadBalance();
  const box = $("#pkgs"); box.textContent = "Loading…";
  const { data, error } = await sb.from("credit_packages").select("id,name,credits,price_minor,currency").eq("active", true).order("sort_order");
  box.textContent = "";
  if (error || !data || !data.length){ box.textContent = "No packages are available right now."; return; }
  data.forEach((p) => {
    const row = document.createElement("div"); row.className = "pkg";
    const left = document.createElement("div");
    const b = document.createElement("b"); b.textContent = p.name;
    const s = document.createElement("small"); s.textContent = p.credits + " credits for " + fmtMoney(p.price_minor, p.currency);
    left.append(b, s);
    const btn = document.createElement("button"); btn.className = "btn primary small"; btn.textContent = "Buy";
    btn.onclick = async () => {
      btn.disabled = true;
      const { data: d, error: er } = await sb.functions.invoke("create-payment-intent", { body: { packageId: p.id } });
      btn.disabled = false;
      const n = $("#buyNote"); n.className = "msg-note";
      if (er){ const info = await fnError(er); n.className = "msg-note err";
        n.textContent = /PROVIDER/.test(info.code || "") ? "Payments are not available yet. Please check back soon." : (info.error || "Could not start the payment."); return; }
      if (d && d.checkoutUrl) location.href = d.checkoutUrl; else { n.className = "msg-note err"; n.textContent = "Payments are not available yet. Please check back soon."; }
    };
    row.append(left, btn); box.appendChild(row);
  });
}
$("#buyBtn").onclick = () => openCredits();
$("#creditPill").onclick = () => openCredits();

/* ---- Settings ---- */
$("#settingsBtn").onclick = () => {
  closeSide();
  $("#setEmail").textContent = state.user ? state.user.email : "";
  $("#setName").value = (state.profile && state.profile.display_name) || "";
  $("#setTheme").value = store("nova-theme") || "auto"; $("#setNote").textContent = ""; $("#passNote").textContent = ""; $("#setPass").value = "";
  $("#settingsDlg").showModal();
};
$("#saveSettings").onclick = async () => {
  const name = $("#setName").value.trim().slice(0, 100), theme = $("#setTheme").value;
  store("nova-theme", theme === "auto" ? "" : theme); applyTheme(theme === "auto" ? null : theme);
  const { error } = await sb.from("profiles").update({ display_name: name || null }).eq("id", state.user.id);
  const n = $("#setNote");
  if (error){ n.className = "msg-note err"; n.textContent = "Could not save your name."; return; }
  state.profile = { display_name: name }; n.className = "msg-note ok"; n.textContent = "Saved.";
  if (!state.activeId && $("#msgs .hero")) showHero();
};
$("#savePass").onclick = async () => {
  const p = $("#setPass").value, n = $("#passNote");
  if (p.length < 6){ n.className = "msg-note err"; n.textContent = "Use at least 6 characters."; return; }
  const { error } = await sb.auth.updateUser({ password: p });
  if (error){ n.className = "msg-note err"; n.textContent = error.message; return; }
  $("#setPass").value = ""; n.className = "msg-note ok"; n.textContent = "Password updated.";
};
$("#delAcct").onclick = async () => {
  if (!confirm("Delete your account? Your chats, files and remaining credits will be permanently removed.")) return;
  const t = prompt("Type DELETE to confirm"); if (t !== "DELETE") return;
  const { error } = await sb.functions.invoke("delete-account", { body: { confirm: "DELETE" } });
  if (error){ const info = await fnError(error); toast(info.error || "Could not delete the account."); return; }
  $("#settingsDlg").close();
  try { await sb.auth.signOut({ scope: "local" }); } catch(e){}
  state.user = null; showAuth(); toast("Your account was deleted.");
};
document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => b.closest("dialog").close());
document.querySelectorAll("dialog").forEach((d) => d.addEventListener("click", (e) => { if (e.target === d) d.close(); }));

/* ---- Shell ---- */
$("#menuBtn").onclick = () => { $("#side").classList.add("open"); $("#scrim").hidden = false; };
$("#closeSide").onclick = closeSide; $("#scrim").onclick = closeSide;
$("#newChat").onclick = newChat;
$("#signOut").onclick = async () => { await sb.auth.signOut(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.user && state.appShown) loadBalance(); });

async function bootApp(){
  await Promise.all([loadProfile(), loadBalance(), loadConvs()]);
  newChat();
}

/* ---- Start ---- */
(async function init(){
  setMode("in");
  if (!ENABLE_GOOGLE){ $("#googleBtn").hidden = true; document.querySelector(".divider").hidden = true; }
  const { data } = await sb.auth.getSession();
  if (data.session){ state.user = data.session.user; showApp(); } else showAuth();
})();
})();
</script>
