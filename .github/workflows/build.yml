name: Build Nova APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nova-debug-keystore-v1

      - run: npm install

      - name: Add Android back-button support
        run: |
          cat > www/native.js <<'EOF'
          (function () {
            var cap = window.Capacitor;
            var App = cap && cap.Plugins && cap.Plugins.App;
            if (!App) return;
            App.addListener("backButton", function () {
              var dlg = document.querySelector("dialog[open]");
              if (dlg) { dlg.close(); return; }
              var side = document.getElementById("side");
              if (side && side.classList.contains("open")) { document.getElementById("closeSide").click(); return; }
              App.minimizeApp();
            });
          })();
          EOF
          sed -i 's#</body>#<script src="native.js"></script></body>#' www/index.html

      - run: npx cap add android

      - name: App icon and version number
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/drawable $RES/values $RES/mipmap-anydpi-v26
          cat > $RES/values/nova_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="nova_icon_bg">#0A7C4A</color>
          </resources>
          EOF
          cat > $RES/drawable/nova_icon_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="1.8"
                  android:scaleY="1.8"
                  android:translateX="32.4"
                  android:translateY="32.4">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M12,2 C12.8,8 16,11.2 22,12 C16,12.8 12.8,16 12,22 C11.2,16 8,12.8 2,12 C8,11.2 11.2,8 12,2 Z" />
              </group>
          </vector>
          EOF
          for f in ic_launcher ic_launcher_round; do
          cat > $RES/mipmap-anydpi-v26/$f.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nova_icon_bg" />
              <foreground android:drawable="@drawable/nova_icon_fg" />
          </adaptive-icon>
          EOF
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nova.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: Nova.apk

      - name: Publish a download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova build ${{ github.run_number }}
          files: Nova.apk
          make_latest: true
